<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Genesys Mobile">
  <title>Genesys Active Conversations</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    :root{
      --bg:#f3f4f6;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
      --primary:#2563eb;--danger:#dc2626;--ok:#059669;--soft:#eef2ff;
      --shadow:0 5px 18px rgba(0,0,0,.07)
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    button,input,select{font:inherit}
    .app{max-width:980px;margin:auto;padding:14px 14px 116px}
    .header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}
    .title{font-size:22px;font-weight:900}
    .sub{font-size:12px;color:var(--muted)}
    .panel,.card,.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    .panel{padding:14px;margin-bottom:12px}
    label{display:block;font-size:12px;font-weight:800;margin:7px 0 6px}
    input,select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:12px;background:#fff}
    button{border:0;border-radius:12px;padding:12px 14px;font-weight:800;cursor:pointer}
    button:disabled{opacity:.5}
    .btn{background:#e5e7eb;color:#111827}
    .primary{background:var(--primary);color:#fff}
    .danger{background:var(--danger);color:#fff}
    .ok{background:var(--ok);color:#fff}
    .toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .userbox{font-size:13px;padding:9px 11px;border-radius:12px;background:#ecfdf5;border:1px solid #a7f3d0;display:none}
    .status{font-size:13px;font-weight:800;margin-top:9px}
    .note{font-size:12px;color:#1e3a8a;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;padding:9px;margin-top:10px}
    .row{display:grid;grid-template-columns:1fr;gap:10px}
    .stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
    .stat{padding:12px}.stat .n{font-size:22px;font-weight:900}.stat .l{font-size:12px;color:var(--muted)}
    .list{display:grid;gap:10px}.card{padding:12px}.card.selected{outline:3px solid rgba(37,99,235,.22)}
    .top{display:flex;gap:10px}.check{width:25px;height:25px;accent-color:var(--primary);margin-top:2px}
    .grow{flex:1;min-width:0}.badge{display:inline-block;background:var(--soft);padding:4px 8px;border-radius:999px;font-size:11px;font-weight:800;margin:0 4px 5px 0}
    .cid{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:#374151}
    .meta{display:grid;gap:5px;font-size:13px;margin-top:8px}.muted{color:var(--muted)}
    .empty{text-align:center;padding:28px;color:var(--muted)}
    .log{height:145px;overflow:auto;white-space:pre-wrap;background:#0b1220;color:#d1fae5;padding:10px;border-radius:12px;font:12px ui-monospace,monospace}
    .sticky{position:fixed;left:0;right:0;bottom:0;z-index:50;background:#ffffffee;border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
    .sticky>div{max-width:980px;margin:auto}.sticky button{width:100%}
    @media(min-width:720px){.row{grid-template-columns:1fr 1fr}.stats{grid-template-columns:repeat(4,1fr)}.meta{grid-template-columns:1fr 1fr}}
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <div>
      <div class="title">Genesys Active Conversations</div>
      <div class="sub">Mobile Web • GitHub Pages • Genesys Cloud JP</div>
    </div>
    <button class="btn" id="logoutBtn" style="display:none">Logout</button>
  </div>

  <div class="panel">
    <div id="loginArea">
      <button id="loginBtn" class="primary" style="width:100%">Login with Genesys Cloud</button>
      <div class="note">
        เว็บนี้ไม่รับ Genesys password และไม่เก็บ access token แบบถาวร Token จะอยู่เฉพาะ session ของ browser
      </div>
    </div>

    <div id="userBox" class="userbox"></div>

    <div id="controls" style="display:none;margin-top:8px">
      <div class="row">
        <div>
          <label>Look back</label>
          <select id="days">
            <option value="1">1 day</option>
            <option value="3">3 days</option>
            <option value="7" selected>7 days</option>
            <option value="14">14 days</option>
            <option value="30">30 days</option>
            <option value="31">31 days</option>
          </select>
        </div>
        <div>
          <label>Media</label>
          <select id="media">
            <option value="">All media</option>
            <option value="voice">Voice only</option>
          </select>
        </div>
      </div>
      <div class="toolbar" style="margin-top:10px">
        <button id="loadBtn" class="primary">Load Active</button>
        <button id="refreshBtn" class="btn">Refresh</button>
      </div>
    </div>
    <div id="status" class="status">Not logged in</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="totalCount">0</div><div class="l">Active</div></div>
    <div class="stat"><div class="n" id="selectedCount">0</div><div class="l">Selected</div></div>
    <div class="stat"><div class="n" id="voiceCount">0</div><div class="l">Voice</div></div>
    <div class="stat"><div class="n" id="outboundCount">0</div><div class="l">Outbound</div></div>
  </div>

  <div class="panel">
    <div class="toolbar">
      <button id="selectAllBtn" class="btn">Select All</button>
      <button id="clearBtn" class="btn">Clear</button>
    </div>
    <input id="search" style="margin-top:10px" placeholder="Search Conversation / Agent / Queue / Media">
    <div id="list" class="list" style="margin-top:10px">
      <div class="empty">Login ก่อนเพื่อโหลด Active Conversations</div>
    </div>
  </div>

  <div class="panel">
    <label>Log</label>
    <div id="log" class="log">Ready</div>
  </div>
</div>

<div class="sticky">
  <div><button id="disconnectBtn" class="danger" disabled>Disconnect Selected (0)</button></div>
</div>

<script src="./config.js"></script>
<script src="./app.js"></script>
</body>
</html>
